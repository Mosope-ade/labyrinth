[package]
name = "labyrinth-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
description = "Hosted API application boundary"

[lints]
workspace = true

[features]
postgres-tests = []

[dependencies]
labyrinth-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "migrate", "macros"] }

axum = "0.8"
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
rsa = "0.9"
