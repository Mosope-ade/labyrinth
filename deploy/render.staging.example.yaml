# Zero-budget development staging: free API only; worker runs on an operator machine.
# Secrets are operator-supplied; automatic deployment is disabled.
services:
- type: web
  name: labyrinth-staging-api
  runtime: docker
  region: frankfurt
  plan: free
  numInstances: 1
  autoDeployTrigger: 'off'
  dockerfilePath: ./deploy/Dockerfile
  dockerContext: .
  dockerCommand: /app/labyrinth-api
  maxShutdownDelaySeconds: 30
  envVars:
  - key: LABYRINTH_BIND
    value: 0.0.0.0:10000
  - key: LABYRINTH_AUTH_ISSUER
    sync: false
  - key: LABYRINTH_DATABASE_URL
    sync: false
  - key: LABYRINTH_DB_MAX_CONNECTIONS
    value: '4'
  - key: LABYRINTH_DB_ACQUIRE_TIMEOUT_MS
    value: '1000'
  - key: LABYRINTH_DB_STATEMENT_TIMEOUT_MS
    value: '5000'
  - key: LABYRINTH_DB_LOCK_TIMEOUT_MS
    value: '1000'
  - key: LABYRINTH_HTTP_MAX_IN_FLIGHT
    value: '4'
  - key: LABYRINTH_HTTP_TIMEOUT_MS
    value: '10000'
  - key: LABYRINTH_TENANT_MAX_PROJECTS
    value: '50'
  - key: LABYRINTH_ONBOARDING_MAX_ACTIVE_JOBS
    value: '2'
  - key: LABYRINTH_ARTIFACT_STORAGE_ORIGIN
    sync: false
  - key: LABYRINTH_ARTIFACT_STORAGE_BUCKET
    value: engineering-packages
  - key: LABYRINTH_ARTIFACT_STORAGE_TOKEN
    sync: false
  healthCheckPath: /health/ready
