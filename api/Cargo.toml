[package]
name = "labyrinth-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
description = "Hosted API application boundary"

[lints]
workspace = true

[features]
postgres-tests = []

[dependencies]
labyrinth-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "migrate", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
