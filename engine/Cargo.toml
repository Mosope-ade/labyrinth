[package]
name = "labyrinth-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
description = "Pure deterministic vendor-neutral network engineering engine"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize", "serialize"] }
sha2 = "0.10"
semver = "1"
ipnet = "2"

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
